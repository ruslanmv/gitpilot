name: Build Binaries (All-in-One)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      APP_NAME: gitpilot
      SPEC_FILE: installer/pyinstaller/gitpilot.spec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install -U pip wheel setuptools
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Embed frontend into backend
        run: |
          python installer/build/embed_frontend.py

      - name: Build binary (PyInstaller)
        run: |
          python -m PyInstaller "${{ env.SPEC_FILE }}"

      - name: Verify bundle
        run: |
          python installer/build/verify_bundle.py

      - name: Create portable archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          python installer/build/package_portable.py --version "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitpilot-${{ matrix.os }}
          path: dist_artifacts/*
          if-no-files-found: error
