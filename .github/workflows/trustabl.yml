name: Trustabl Agent Scanner

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Minimal top-level permissions; write grants are scoped to the scan job only.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trustabl-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Trustabl is advisory in this repository. Keep findings, SARIF, and PR
      # annotations, but do not make medium+ findings fail the CI job.
      - uses: trustabl/trustabl-action@d97575c864814bf4965fa2c72c044224d372723a # v0.4.3
        continue-on-error: true
        with:
          version: v0.1.9
          severity-threshold: none
