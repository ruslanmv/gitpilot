[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI project name – MUST match what you configured in PyPI Trusted Publishers
name = "gitcopilot"
version = "0.2.8"
description = "Multi-agent AI coding assistant — four specialized agents (Explorer, Planner, Coder, Reviewer) that read your repo, plan safe changes, write code, run tests, and wait for your approval. Any LLM."
requires-python = ">=3.11,<3.13"
readme = "README.md"

# Use a simple SPDX license string, not a table
license = "Apache-2.0"

authors = [{ name = "Ruslan Magana Vsevolodovna" }]
keywords = [
    "ai",
    "github",
    "copilot",
    "agentic",
    "crewai",
    "llm",
    "openai",
    "claude",
    "watsonx",
    "ollama",
    "fastapi",
    "react",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # License classifier removed to avoid deprecation warning
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: JavaScript",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.1.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "crewai[anthropic]>=0.76.9",  
  "anthropic>=0.39.0",           
  "crewai-tools>=0.13.4",
  "ibm-watsonx-ai>=1.1.0",
  "langchain-ibm>=0.3.0",
  "rich>=13.0.0",
  "pyjwt[crypto]>=2.8.0",
  "litellm>=1.80.5", 
]

[project.urls]
Homepage = "https://github.com/ruslanmv/gitpilot"
Documentation = "https://github.com/ruslanmv/gitpilot#readme"
Repository = "https://github.com/ruslanmv/gitpilot"
Issues = "https://github.com/ruslanmv/gitpilot/issues"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "coverage[toml]>=7.5",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "build>=1.2.1",
  "twine>=5.0.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
# CLI entry points: these remain based on the python package `gitpilot`
gitpilot = "gitpilot.cli:main"
gitpilot-api = "gitpilot.cli:serve_only"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitpilot*"]  # package directory is gitpilot/

[tool.setuptools.package-data]
gitpilot = ["web/*", "web/**/*", "py.typed", "mcp_catalog/*/register.json"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PL"]
ignore = ["S101", "PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# Coverage configuration — Batch P1-B
#
# Strategy: rather than gating the entire codebase (which would force fake
# tests on legacy modules and fight backwards-compatibility), we maintain
# an explicit allowlist of *gated modules*.  Each module on the list must
# stay at >= 80 % coverage; new well-tested modules join the list as they
# land.  This locks current quality without blocking unrelated PRs.
#
# Run via `make coverage` or `pytest --cov=gitpilot --cov-report=term-missing`.
[tool.coverage.run]
branch = true
# `include` restricts the report to the gated modules.  The full-tree run
# is still available via `make coverage-full` for visibility.
include = [
  "gitpilot/flags.py",
  "gitpilot/agents_md.py",
  "gitpilot/mentions.py",
  "gitpilot/context_budget.py",
  "gitpilot/tool_groups.py",
  "gitpilot/mcp_toggles.py",
  "gitpilot/modes.py",
  "gitpilot/slash_commands.py",
  "gitpilot/checkpoints.py",
  "gitpilot/rules.py",
  "gitpilot/sandbox.py",
  "gitpilot/shell_safety.py",
  "gitpilot/glob_match.py",
  "gitpilot/sandbox_routing.py",
  "gitpilot/toolkit/registry.py",
  "gitpilot/toolkit/builtins.py",
  "gitpilot/toolkit/web.py",
  "gitpilot/toolkit/mcp.py",
  "gitpilot/agent/contracts.py",
  "gitpilot/agent/model_profile.py",
  "gitpilot/agent/providers/__init__.py",
  "gitpilot/agent/providers/base.py",
  "gitpilot/agent/providers/openai_compat.py",
  "gitpilot/agent/adapter.py",
  "gitpilot/agent/dialects/native.py",
  "gitpilot/agent/dialects/react_text.py",
  "gitpilot/agent/dialects/lite.py",
  "gitpilot/agent/journal.py",
  "gitpilot/agent/context.py",
  "gitpilot/agent/loop.py",
  "gitpilot/agent/prompts.py",
  "gitpilot/agent/runner.py",
  "gitpilot/agent/headless.py",
  "gitpilot/agent/policy.py",
  "gitpilot/agent/command_class.py",
  "gitpilot/agent/approvals.py",
  "gitpilot/agent/checkpointing.py",
  "gitpilot/agent/hook_bridge.py",
  "gitpilot/agent/delegation.py",
  "gitpilot/agent/resume.py",
  "gitpilot/agent/replay_events.py",
  "gitpilot/agent/compaction.py",
  "gitpilot/agent/system_payload.py",
  "gitpilot/yaml_lite.py",
  "gitpilot/topology/schema.py",
  "gitpilot/topology/registry.py",
  # The benchmark harness (Batch V4-G4). Not shipped in the wheel, but it is
  # what gates the Phase G flip, so it is held to the same standard.
  "bench/tasks.py",
  "bench/matrix.py",
  "bench/report.py",
  "bench/runner.py",
  "bench/gate.py",
  "gitpilot/toolkit/todo.py",
  "gitpilot/sandbox_tokens.py",
  "gitpilot/trusted_folders.py",
  "gitpilot/errors.py",
  "gitpilot/doctor.py",
  "gitpilot/prompt_cache.py",
  "gitpilot/tool_def_pruner.py",
  "gitpilot/context_cache.py",
  "gitpilot/streaming.py",
  "gitpilot/warmup.py",
  "gitpilot/init_wizard.py",
  "gitpilot/_deprecation.py",
  "gitpilot/plan_guards.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.",
]
