<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!--
    GitPilot activity-bar icon.
    VS Code renders sidebar icons as monochrome silhouettes using
    `currentColor`, so this uses only stroke/fill with currentColor.
    Design: simplified GP monogram inside a progress-ring arc,
    echoing the master logo (docs/logo.svg) at 24×24.
  -->

  <!-- Outer ring (full circle, subtle) -->
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>

  <!-- Active arc (top-right quarter, the "live" indicator from the master logo) -->
  <path
    d="M 12 2 A 10 10 0 0 1 22 12"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- GP monogram -->
  <text
    x="12"
    y="16"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-size="10"
    font-weight="700"
    fill="currentColor"
    letter-spacing="-0.5"
  >GP</text>
</svg>
